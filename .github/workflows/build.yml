name: Build QuickKey IPA
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          submodules: false  # 关掉递归子模块，解决128报错

      - name: Install ldid
        run: brew install ldid

      - name: Setup Theos
        run: |
          export THEOS=$HOME/theos
          git clone https://github.com/theos/theos.git $THEOS
          git clone --depth 1 https://github.com/theos/sdks.git $THEOS/sdks

      - name: Fix script line ending
        run: sed -i '' 's/\r$//' ./制作文件

      - name: Compile & Package IPA
        run: |
          export THEOS=$HOME/theos
          set -o pipefail
          make clean all
          chmod +x ./制作文件
          ./制作文件

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: QuickKey-IPA
          path: build/*.ipa
